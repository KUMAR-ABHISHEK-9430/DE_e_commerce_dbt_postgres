services: 
 postgres: 
   image: postgres:15 
   container_name: dbt_postgres 
   restart: always 
   environment: 
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
     POSTGRES_DB: ${POSTGRES_DB}
   ports: 
     - "${POSTGRES_PORT:-5432}:5432" 
   volumes: 
     - postgres_data:/var/lib/postgresql/data 
   networks: 
     - dbt_network 
 
 dbt: 
   build: . 
   container_name: dbt_core 
   environment:
     DBT_POSTGRES_HOST: postgres
     DBT_POSTGRES_PORT: 5432
     DBT_POSTGRES_USER: ${POSTGRES_USER}
     DBT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
     DBT_POSTGRES_DB: ${POSTGRES_DB}
   ports: 
     - "8080:8080"
   volumes: 
     - ./dbt_project:/usr/app 
     - ./dbt_project/.dbt:/root/.dbt
   depends_on: 
     - postgres 
   networks: 
     - dbt_network 
 
volumes: 
 postgres_data: 
 
networks: 
 dbt_network: 
   driver: bridge 